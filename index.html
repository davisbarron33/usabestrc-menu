
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0033A0">
  <meta name="description" content="Redes sociales y catálogo de USABesTRC.">
  <title>USABesTRC | Tus marcas favoritas</title>
  <style>
    :root {
      --blue: #0033A0;
      --red: #FF1E2D;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #14213d;
      background:
        radial-gradient(circle at 8% 10%, #ffffffb8 0 2px, transparent 3px),
        radial-gradient(circle at 92% 22%, #ffffff8c 0 2px, transparent 3px),
        linear-gradient(145deg, #0033A0 0%, #1658c7 36%, #ffffff 56%, #fff5f5 70%, #FF1E2D 100%);
      background-size: 42px 42px, 54px 54px, cover;
      background-attachment: fixed;
    }
    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 23px 24px;
      text-align: center;
      border: 1px solid #ffffffcc;
      border-radius: 26px;
      background: #fffffff0;
      box-shadow: 0 18px 50px #00144b40;
      backdrop-filter: blur(8px);
    }
    .stars {
      color: var(--blue);
      letter-spacing: 7px;
      font-size: 20px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(29px, 7vw, 38px);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.8px;
    }
    h1 .usa { color: var(--blue); }
    h1 .trc { color: var(--red); }
    .tagline {
      margin: 11px 0 5px;
      font-size: 17px;
      font-weight: 700;
    }
    .subtitle {
      margin: 0 0 24px;
      color: #526078;
      font-size: 14px;
      line-height: 1.5;
    }
    .links { display: grid; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      min-height: 54px;
      padding: 14px 17px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-weight: 750;
      font-size: 15px;
      box-shadow: 0 5px 12px #0c204824;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px #0c20472e;
    }
    .btn:focus-visible {
      outline: 3px solid #ffcf33;
      outline-offset: 3px;
    }
    .btn svg {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      fill: currentColor;
    }
    .facebook { background: #1877F2; }
    .instagram {
      background: linear-gradient(110deg, #833AB4, #E1306C, #F77737);
    }
    .catalog { background: var(--blue); }
    .whatsapp { background: #20B95A; }
    .tiktok { background: #111111; }
    .footer {
      margin: 22px 0 0;
      font-size: 11px;
      color: #657089;
      letter-spacing: .5px;
    }
    .flag {
      height: 5px;
      width: 94px;
      margin: 16px auto 0;
      border-radius: 10px;
      background: linear-gradient(to right, var(--blue) 0 33.33%, white 33.33% 66.66%, var(--red) 66.66% 100%);
      border: 1px solid #0000000d;
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
